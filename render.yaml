services:
  - type: web
    name: remoterise
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASS
        value: remoterise2026
      - key: DATABASE_URL
        fromDatabase:
          name: remoterise-db
          property: connectionString

databases:
  - name: remoterise-db
    plan: free
